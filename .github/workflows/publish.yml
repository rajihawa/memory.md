name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      # No token: id-token: write above lets npm authenticate via OIDC, and
      # provenance is attached automatically. access set in publishConfig.
      - name: Test
        run: npm test

      # Facts, not guesses: is GitHub granting an OIDC token for npm at all?
      - name: Verify OIDC token
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC URL missing — id-token permission not granted" && exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=registry.npmjs.org")
          echo "OIDC token endpoint HTTP: $code"
          [ "$code" = "200" ] || { echo "GitHub refused the token — check workflow permissions"; exit 1; }

      - run: npm publish
